<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ورود به حساب کاربری</title>

    <!-- Bootstrap RTL -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />

    <!-- استایل صفحه ورود -->
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-panel">
        <div class="login-content">
          <!-- لوگو -->
          <div class="login-logo">
            <img src="img/logo.png" alt="لوگوی سایت" />
          </div>

          <!-- توضیحات -->
          <p class="login-subtitle">جهت ثبت و نگهداری اطلاعات و ورود به حساب</p>

          <!-- عنوان -->
          <h1 class="login-title login-title-desktop">
            لطفا شماره موبایل خود را وارد کنید
          </h1>

          <h1 class="login-title login-title-mobile">
            شماره موبایل خود را وارد کنید
          </h1>

          <!-- فرم ورود -->
          <form class="login-form" id="loginForm">
            <label for="phone" class="login-label">
              شماره تماس
              <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="phone"
              name="phone"
              class="login-input"
              placeholder="شماره تماس خود را وارد نمایید"
              inputmode="numeric"
              autocomplete="tel"
              maxlength="11"
              required
            />

            <p class="phone-error" id="phoneError" hidden>
              این شماره قبلا ثبت شده است
              <a href="#" id="existingUserLink">ورود به حساب کاربری</a>
            </p>

            <div class="login-actions" id="loginActions">
              <a href="landing.html" class="back-button">بازگشت</a>
              <button type="submit" class="send-button">ارسال کد</button>
            </div>

            <button
              type="button"
              class="existing-user-button"
              id="existingUserButton"
              hidden
            >
              ایجاد حساب کاربری
            </button>
          </form>
        </div>
      </section>
    </main>

    <script>
      const loginForm = document.getElementById("loginForm");
      const phoneInput = document.getElementById("phone");
      const phoneError = document.getElementById("phoneError");
      const loginActions = document.getElementById("loginActions");
      const existingUserButton = document.getElementById("existingUserButton");
      const existingUserLink = document.getElementById("existingUserLink");

      // شماره آزمایشی ثبت‌شده
      const registeredPhones = ["09123456789"];

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const phone = phoneInput.value.trim();

        if (!/^09\d{9}$/.test(phone)) {
          alert("لطفاً شماره موبایل معتبر وارد کنید.");
          return;
        }

        if (registeredPhones.includes(phone)) {
          phoneError.hidden = false;
          phoneInput.classList.add("input-error");
          loginActions.hidden = true;
          existingUserButton.hidden = false;
          return;
        }

        window.location.href = "verify.html?phone=" + encodeURIComponent(phone);
      });

      phoneInput.addEventListener("input", function () {
        phoneError.hidden = true;
        phoneInput.classList.remove("input-error");
        loginActions.hidden = false;
        existingUserButton.hidden = true;
      });

      function goToUserLogin(event) {
        if (event) event.preventDefault();

        const phone = phoneInput.value.trim();

        window.location.href =
          "login-user.html?phone=" + encodeURIComponent(phone);
      }

      existingUserButton.addEventListener("click", goToUserLogin);

      if (existingUserLink) {
        existingUserLink.addEventListener("click", goToUserLogin);
      }
    </script>
  </body>
</html>

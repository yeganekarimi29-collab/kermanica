<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ثبت‌نام صاحب کسب‌وکار | کرمانیکا</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ccs/bootstrap.main.ccs" />

    <link rel="stylesheet" href="css/business-register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="container header-section">
      <div
        class="d-flex justify-content-center justify-content-md-start align-items-center"
      >
        <img src="img/logo.png" alt="لوگوی کرمانیکا" class="logo" />

        <div class="brand-text desktop-txt">
          <h1>پویش حمایت از کالای کرمانی</h1>
          <p>قدمی برای تحول همه‌جانبه کسب‌وکارها</p>
        </div>
      </div>
    </header>

    <main class="container form-container">
      <div class="form-card">
        <img src="img/logo.png" alt="لوگوی کرمانیکا" class="form-logo" />

        <h2 class="form-title">لطفاً اطلاعات خود را با دقت وارد نمایید.</h2>

        <form id="businessForm">
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="businessType" class="form-label desktop-txt">
                نوع کسب‌وکار <span class="text-danger">*</span>
              </label>

              <label for="businessType" class="form-label mobile-txt">
                نوع کسب‌وکار شما<span class="text-danger">*</span>
              </label>

              <select id="businessType" class="form-select" required>
                <option value="" selected disabled>
                  نوع کسب‌وکار خود را انتخاب کنید
                </option>
                <option value="تولیدی">تولیدی</option>
                <option value="خدماتی">خدماتی</option>
                <option value="فروشگاهی">فروشگاهی</option>
                <option value="صنایع دستی">صنایع دستی</option>
                <option value="سایر">سایر</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label for="businessField" class="form-label mobile-txt">
                کسب و کار شما در چه حوزه‌ایی فعالیت می‌کند؟
              </label>

              <label for="businessField" class="form-label desktop-txt">
                حوزه فعالیت کسب‌وکار
              </label>

              <select id="businessField" class="form-select" required>
                <option value="" selected disabled>انتخاب کنید</option>
                <option value="صنعت">صنعت</option>
                <option value="کشاورزی">کشاورزی</option>
                <option value="مواد غذایی">مواد غذایی</option>
                <option value="پوشاک">پوشاک</option>
                <option value="خدمات">خدمات</option>
                <option value="سایر">سایر</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label for="employeeCount" class="form-label desktop-txt">
                تعداد نیروهای مستقیم
              </label>

              <label for="employeeCount" class="form-label mobile-txt">
                چه تعداد نیروی مستقیم دارید؟
              </label>

              <select id="employeeCount" class="form-select" required>
                <option value="" selected disabled>بین 10 تا 20 نفر</option>
                <option value="1-10">بین ۱ تا ۱۰ نفر</option>
                <option value="11-50">بین ۱۱ تا ۵۰ نفر</option>
                <option value="51-100">بین ۵۱ تا ۱۰۰ نفر</option>
                <option value="100+">بیشتر از ۱۰۰ نفر</option>
              </select>
            </div>

            <div class="col-12 col-md-4">
              <label for="brandName" class="form-label"> نام برند </label>

              <input
                type="text"
                id="brandName"
                class="form-control"
                placeholder="نام برند خود را کامل بنویسید"
                required
              />
            </div>

            <div class="col-12 col-md-4">
              <label for="managerName" class="form-label">
                نام و نام خانوادگی مدیرعامل
              </label>

              <input
                type="text"
                id="managerName"
                class="form-control"
                required
              />
            </div>

            <div class="col-12 col-md-4">
              <label for="website" class="form-label"> وب‌سایت </label>

              <input
                type="url"
                id="website"
                class="form-control"
                placeholder="مثال: https://example.ir"
              />
            </div>
          </div>

          <div class="products-section mt-4">
            <label for="productInput" class="form-label desktop-txt">
              محصولات
            </label>
            <label for="productInput" class="form-label mobile-txt">
              چه محصولاتی تولید میکنید؟
            </label>

            <div class="row g-2 align-items-start">
              <div class="col-9 col-md-8">
                <input
                  type="text"
                  id="productInput"
                  class="form-control"
                  placeholder="نام هر محصول خود را وارد کنید و ثبت یا اینتر بزنید."
                />
              </div>

              <div class="col-3 col-md-2">
                <button
                  type="button"
                  id="addProduct"
                  class="btn btn-primary w-100"
                >
                  ثبت
                </button>
              </div>
            </div>

            <div id="productList" class="product-list mt-3"></div>
          </div>

          <div class="form-actions d-flex align-items-center gap-3 mt-5">
            <button a href="success.html" class="btn btn-primary submit-button">
              تأیید
            </button>

            <a href="register.html" class="back-button"> بازگشت </a>
          </div>

          <div id="formMessage" class="mt-3" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/business-register.js"></script>
  </body>
</html>

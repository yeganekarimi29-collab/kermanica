<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشکلی رخ داده است</title>

    <link
        href="css/bootstrap.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/error.css">
</head>

<body>

    <main class="error-page">
        <section class="error-content">

            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none">
                    <path
                        d="M27 9.5L5.5 47C3.2 51 6 56 10.5 56H53.5C58 56 60.8 51 58.5 47L37 9.5C34.7 5.5 29.3 5.5 27 9.5Z"
                        stroke="currentColor"
                        stroke-width="3.5"
                        stroke-linejoin="round"
                    />
                    <path
                        d="M32 23V37"
                        stroke="currentColor"
                        stroke-width="4"
                        stroke-linecap="round"
                    />
                    <circle cx="32" cy="45" r="2.4" fill="currentColor"/>
                </svg>
            </div>

            <h1>مشکلی رخ داده است!</h1>

            <p class="error-description">
                لطفا در ساعتی دیگر دوباره تلاش نمایید!
            </p>

            <div class="error-actions">
                <a href="javascript:location.reload()" class="error-button retry-button">
                    <span class="mobile-text">امتحان مجدد</span>
                    <span class="desktop-text">تلاش مجدد</span>
                </a>

                <a href="login.html" class="error-button back-button">
                    بازگشت
                </a>
            </div>

        </section>
    </main>

</body>
</html>
